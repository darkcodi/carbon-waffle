[package]
name = "carbon-waffle"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "x11", "wayland"] }
nix = { version = "0.30", features = ["signal", "process", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
iced_runtime = "0.14"
iced_tiny_skia = "0.14"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

# Scrolling must stay responsive with `cargo run`. Unoptimized software
# rasterization and text shaping can stall the UI thread.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
